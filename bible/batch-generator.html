<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Amazon Affiliate Batch Link Generator (CSV Ready)</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      color: #222;
    }
    textarea, input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      font-size: 15px;
      box-sizing: border-box;
    }
    button {
      background: #002147;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: #003a80; }
    pre {
      background: #f7f7f7;
      padding: 10px;
      border: 1px solid #ccc;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .buttons { display: flex; gap: 10px; margin-top: 10px; }
  </style>
</head>
<body>
  <h2>Amazon Affiliate Batch Link Generator</h2>
  <p>Enter ASINs or ISBN13s (one per line):</p>
  <textarea id="asinList" rows="10" placeholder="B0FB8GP9JG&#10;B0FGDHJLSZ&#10;9798290235202"></textarea>
  <p>Affiliate Tag:</p>
  <input id="tag" type="text" value="themissiontod-20">
  <div class="buttons">
    <button onclick="generateLinks()">Generate Links</button>
    <button onclick="downloadCSV()">Download CSV</button>
  </div>

  <h3>Output:</h3>
  <pre id="output"></pre>

  <script>
    let currentLinks = [];

    function generateLinks() {
      const asins = document.getElementById('asinList').value.trim().split(/\s+/);
      const tag = document.getElementById('tag').value.trim();
      const template = "https://www.amazon.com/gp/product/[ASIN]/ref=as_li_tf_tl?ie=UTF8&camp=1789&creative=9325&creativeASIN=[ASIN]&linkCode=as2&tag=" + tag;
      currentLinks = asins.map(a => ({
        ASIN: a,
        AffiliateLink: template.replace(/\[ASIN\]/g, a)
      }));
      const lines = currentLinks.map(l => `${l.ASIN},${l.AffiliateLink}`);
      document.getElementById('output').textContent = lines.join('\n');
    }

    function downloadCSV() {
      if (currentLinks.length === 0) {
        alert("Please generate links first!");
        return;
      }
      const header = "ASIN,AffiliateLink\n";
      const csvContent = header + currentLinks.map(l => `${l.ASIN},${l.AffiliateLink}`).join('\n');
      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "affiliate-links.csv";
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
