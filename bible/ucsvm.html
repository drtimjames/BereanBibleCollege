      padding: 10px;
      border: 1px solid #ccc;

      font-size: 1rem;
    }

      max-height: 70vh;
      overflow-y: auto;
      margin-top: 20px;
      border: 1px solid #ddd;
      border-radius: 6px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .95rem;
    }

    th,
    td {
      border: 1px solid #eee;
      padding: 10px;
      text-align: left;
    }

    th {
      background: #f0f0f0;
      position: sticky;
      top: 0;
      font-weight: 600;
    }

    a {
      color: #007BFF;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .hidden {
      display: none;
    }

    .error {
      color: #d00;
      background: #ffe6e6;
      border: 1px solid #d00;
      padding: 15px;
      border-radius: 6px;
      margin: 20px 0;
      font-family: monospace;
    }

    @media (max-width:768px) {
      h1 {
        font-size: 1.9rem;
      }

      body {
        padding: 20px 15px;
      }

      .ucsvm {
        padding: 18px;
      }
    }
  </style>
</head>

    function parseCSV(text) {
      const rows = []; const lines = text.split(/\r?\n/);
      for (let line of lines) {
        if (!line.trim()) continue;
        let values = [], value = '', inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const c = line[i];
          if (c === '"' && inQuotes && line[i + 1] === '"') { value += '"'; i++; }
          else if (c === '"') inQuotes = !inQuotes;
          else if (c === ',' && !inQuotes) { values.push(value.trim()); value = ''; }
          else value += c;
        }
        values.push(value.trim());
        if (values.every(v => v === '')) continue;
        rows.push(values);
      }
      return rows;
    }

    function renderTable(rows) {
      if (!rows || rows.length < 1) {
        episodeDiv.innerHTML = '<p style="padding:20px;color:#666;">No data.</p>';
        episodeDiv.classList.remove('hidden'); return;
      }
      const table = document.createElement('table');
      const headers = rows[0];
      const thead = document.createElement('thead');
      const trHead = document.createElement('tr');
      headers.forEach(h => { const th = document.createElement('th'); th.textContent = h; trHead.appendChild(th); });
      thead.appendChild(trHead); table.appendChild(thead);
      const tbody = document.createElement('tbody');
      for (let i = 1; i < rows.length; i++) {
        const row = rows[i]; if (!row || row.length === 0) continue;
        const tr = document.createElement('tr');
        headers.forEach((h, idx) => {
          const td = document.createElement('td');
          const cell = row[idx] || '';
          if (h.toLowerCase().includes('url') && cell) {
            const a = document.createElement('a'); a.href = cell; a.target = '_blank'; a.textContent = 'Open Link';
            td.appendChild(a);
          } else td.textContent = cell;
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);
      episodeDiv.innerHTML = ''; episodeDiv.appendChild(table);
      episodeDiv.classList.remove('hidden');
    }

    function loadCSV(file) {
      if (!file) {
        episodeDiv.innerHTML = ''; episodeDiv.classList.add('hidden');
        searchInput.classList.add('hidden');
        searchInput.previousElementSibling.classList.add('hidden');
        return;
      }
      const path = `./csv/${file}`;

      // Try to fetch from file first (works when served via HTTP)
      fetch(path)
        .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.text(); })
        .then(text => {
          const rows = parseCSV(text);
          if (!rows || rows.length < 2) {
            episodeDiv.innerHTML = '<div class="error">No episodes in CSV.</div>';
            episodeDiv.classList.remove('hidden'); return;
          }
          currentRows = rows; renderTable(rows);
          searchInput.classList.remove('hidden');
          searchInput.previousElementSibling.classList.remove('hidden');
        })
        .catch(err => {
          // If fetch fails (CORS/file:// protocol), use embedded data
          console.log('Fetch failed, using embedded data:', err.message);
          if (embeddedData[file]) {
            const rows = parseCSV(embeddedData[file]);
            if (!rows || rows.length < 2) {
              episodeDiv.innerHTML = '<div class="error">No episodes in embedded data.</div>';
              episodeDiv.classList.remove('hidden'); return;
            }
            currentRows = rows; renderTable(rows);
            searchInput.classList.remove('hidden');
            searchInput.previousElementSibling.classList.remove('hidden');
          } else {
            episodeDiv.innerHTML = `
              <div class="error">
                <strong>Error loading ${file}</strong><br><br>
                ${err.message}<br><br>
                <strong>Check:</strong>
                <ul>
                  <li>File exists at <code>./csv/${file}</code></li>
                  <li>Exact spelling & case</li>
                  <li>Browser console (F12)</li>
                </ul>
              </div>`;
            episodeDiv.classList.remove('hidden');
          }
        });
    }

    datasetSelect.addEventListener('change', () => loadCSV(datasetSelect.value));
    searchInput.addEventListener('input', () => {
      const q = searchInput.value.toLowerCase();
      const filtered = currentRows.filter((r, i) => i === 0 || r.some(c => (c || '').toLowerCase().includes(q)));
      renderTable(filtered);
    });
  </script>
