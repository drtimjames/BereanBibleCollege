<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Berean Bible College — Image Library</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff;
      color: #111;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #002147;
      margin-bottom: 20px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .gallery-item {
      border: 1px solid #ccc;
      padding: 5px;
      text-align: center;
      background: #f9f9f9;
      border-radius: 4px;
    }
    .gallery-item img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto 8px;
    }
    .gallery-item p {
      font-size: 14px;
      margin: 0;
      color: #002147;
    }
  </style>
</head>
<body>

  <h1>Berean Bible College — Image Library</h1>

  <div class="gallery">
    <div class="gallery-item">
      <img src="presuppositions.jpg" alt="Presuppositions">
      <p>Presuppositions</p>
    </div>
    <div class="gallery-item">
      <img src="tree_of_life.jpg" alt="Tree of Life">
      <p>Tree of Life</p>
    </div>
    <div class="gallery-item">
      <img src="gods_whispers.jpg" alt="God's Whispers">
      <p>God's Whispers</p>
    </div>
    <div class="gallery-item">
      <img src="day_of_the_lord_v1.jpg" alt="Day of the Lord Vol 1">
      <p>Day of the Lord Vol 1</p>
    </div>
    <div class="gallery-item">
      <img src="day_of_the_lord_v2.jpg" alt="Day of the Lord Vol 2">
      <p>Day of the Lord Vol 2</p>
    </div>
  </div>

</body>
</html>
