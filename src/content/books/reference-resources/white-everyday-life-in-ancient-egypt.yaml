# White, Jon Manchip - Everyday Life in Ancient Egypt
title: "Everyday Life in Ancient Egypt"
subtitle: "Remarkably accurate picture of Egyptian life from the end of the third millennium BC to the Greek occupation in 330 BC examines the roles and tasks assigned to each section of the community. It describes how people spent their leisure hours, how they dressed, what they ate and drank, and more."

