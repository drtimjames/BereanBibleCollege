# Pinch, Geraldine - Egyptian Myth
title: "Egyptian Myth"
subtitle: "A Very Short Introduction by Geraldine Pinch. This book provides an in-depth examination of the cultural and historical context behind the fascinating and complex world of Egyptian myth. Each chapter features a particular object--such as the obelisk known as Cleopatra's Needle, a golden statue of Tutankhamen, and a papyrus containing a story in which the Egyptian gods behave outrageously."

