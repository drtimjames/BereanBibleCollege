# Westbrook-Wells - Everyday Law in Biblical Israel
title: "Everyday Law in Biblical Israel"
subtitle: "This book examines the issues of everyday life--family, property, contracts, and crimes--and providing readers with a broad understanding of their ancient legal and social foundations."

