authorBio: >
  Raymond Westbrook was Professor of Near Eastern Studies at Johns Hopkins
  University, where he taught for twenty years. He was a world-renowned expert
  on biblical law in its ancient Near Eastern context, and wrote or edited
  several books.Bruce Wells is Assistant Professor of Hebrew Bible at St.
  Joseph's University in Philadelphia, Pennsylvania. He has written two books on
  biblical law.

