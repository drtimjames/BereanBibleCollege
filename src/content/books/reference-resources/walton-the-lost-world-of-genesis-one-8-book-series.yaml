# Walton, John - The Lost World of Genesis One 8-Book Series
title: "The Lost World of Genesis One 8-Book Series"
subtitle: "Purchase individually. Titles include: The Lost World of Genesis One: Ancient Cosmology and the Origins Debate (2010), The Lost World of Scripture: Ancient Literary Culture and Biblical Authority (2013),The Lost World of Adam and Eve: Genesis 2-3 and the Human Origins Debate (2015), The Lost World of the Israelite Conquest: Covenant, Retribution, and the Fate of the Canaanites (2017), The Lost World of the Flood: Mythology, Theology, and the Deluge Debate (2018), The Lost World of the Torah: Law as Covenant and Wisdom in Ancient Context (2019), The Lost World of the Prophets: Old Testament Prophecy and Apocalyptic Literature in Ancient Context (2024), New Explorations in the Lost World of Genesis: Advances in the Origins Debate (2025). The books in the Lost World Series follow the pattern set by Bible scholar John H. Walton, bringing a fresh, close reading of the Hebrew text and knowledge of ancient Near Eastern literature to an accessible discussion of the biblical topic at hand using a series of logic-based propositions."

