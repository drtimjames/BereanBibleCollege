# VanDerToorn-Becking-Horst - Dictionary of Deities and Demons in the Bible
title: "Dictionary of Deities and Demons in the Bible"
subtitle: "This unique, invaluable resource is a grand scholarly achievement whose depth, breadth, and contemporaneity will make it useful to scholars and graduate students in religion and ancient cultures. The single major work of reference on the gods, angels, demons, spirits, and semi-divine heroes whose names occur in the biblical books. First published in 1995 and chosen by \"Choice\" as Best Reference Work of 1996, and then in an extensively revised edition in 1998, and now revised again in 2025."

