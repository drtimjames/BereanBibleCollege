# Black-Green - Gods, Demons and Symbols of Ancient Mesopotamia
title: "Gods, Demons and Symbols of Ancient Mesopotamia"
subtitle: "An Illustrated Dictionary. This book provides an introductory guide to the beliefs and customs of the ancient Mesopotamians, spanning approximately 3000 B.C. to the advent of the Christian era. Gods, goddesses, demons, monsters, magic, myths, religious symbolism, rituals, and the spiritual world are all discussed in alphabetical entries, ranging from brief accounts to extended essays."

