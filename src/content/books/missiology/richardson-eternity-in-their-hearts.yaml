authorBio: >
  Don and his late wife, Carol, spent 15 years among the Sawi, a Stone Age tribe
  of Irian Jaya. Don designed an alphabet suited to the Sawi language, authored
  19 primers, taught the tribesmen to read in their native tongue, and
  translated the entire New Testament. More than half of the Sawi accepted Jesus
  Christ as their Lord and Savior. Since 1977, Don has served as
  ambassador-at-large for World Team, a mission organization. Don holds an
  honorary doctorate of literature from Biola University in La Mirada,
  California, is an ordained pastor, and speaks at more than 40 church
  conferences each year.

