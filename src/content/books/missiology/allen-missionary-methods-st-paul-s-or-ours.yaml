authorBio: >
  Roland Allen (b.1868–d.1947) was a British deacon, chaplain, priest, and
  missionary. Allen wrote some of the most straightforward works on missions,
  advocating for the planting of self-supporting and self-governing churches,
  which adapted to local conditions as the Holy Spirit led individuals in their
  own localities. Allen ministered in China, India, Canada, and East Africa. He
  died while serving in Nairobi. His books have been considered some of the most
  revolutionary written on the subject of missions. A must-read.

