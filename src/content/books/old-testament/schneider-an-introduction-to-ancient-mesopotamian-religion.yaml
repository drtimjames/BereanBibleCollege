# Schneider, T.J. - An Introduction to Ancient Mesopotamian Religion
title: "An Introduction to Ancient Mesopotamian Religion"
subtitle: "A basic guide to the religion of the peoples living in the region of the Tigris and Euphrates Rivers from the beginning of the Bronze Age to the time of Alexander the Great and Darius III. Tammi J. Schneider is a professor of religion at Claremont Graduate University and is co-director of excavations at Tell el-Far’ah, Israel. Her other books include Sarah: Mother of Nations."

