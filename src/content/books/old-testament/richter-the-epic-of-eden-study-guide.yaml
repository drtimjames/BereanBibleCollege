# Richter, S.L. - The Epic of Eden Study Guide
title: "The Epic of Eden Study Guide"
subtitle: "This 12-week study brings a new dimension to the history of the ancient Near East, orienting any study group in time, geography, culture, redemption, and relevance to today. From the Pentateuch to patriarchs and from kings to prophets, the Old Testament can feel like a puzzle we’ve tried to put together but wind up putting back in the box because it’s too complicated. The Epic of Eden Video Study Guide is ideal for groups and individuals looking for a deeply substantive and profoundly spiritual exploration of the Old Testament. Dr. Richter, a learned scholar and passionate teacher, demonstrates how an understanding of the Old Testament leads to fresh insights into the New Testament faith for everyday life in the real world. The Epic of Eden video study is ideal for serious church groups seeking a comprehensive study of biblical texts."

